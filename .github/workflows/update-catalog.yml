# Weekly settlement-candidate scan.
#
# Scrapes aggregators for newly opened settlements, drafts REVIEW-marked
# entries by fetching each source page and asking Claude to extract the real
# eligibility/payout/deadline (skipped as a no-op if ANTHROPIC_API_KEY isn't
# configured — see fill_drafts.py), then opens a PR. Entries the model
# resolved are stamped "aiDrafted": true and listed explicitly in the PR body
# so review stays a targeted skim of what changed, not a blind re-check of
# everything. Anything still marked REVIEW needs manual lookup as before.
# GitHub Pages redeploys on merge; installs sync the new catalogue on next
# launch.
#
# If the scrape fails outright (site redesign, bot-blocking), the workflow
# fails and GitHub emails the repo owner — it never fails silently.

name: Update settlements catalogue

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC (~8am CT)
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape aggregators for new settlements
        run: python scripts/scrape_candidates.py

      - name: Draft-fill REVIEW entries from source pages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fill_drafts.py

      - name: Build PR body
        # Written to RUNNER_TEMP, not the checkout — anything inside the repo
        # working tree is fair game for create-pull-request's default "commit
        # everything changed" behavior, and this is a one-run artifact, not a
        # catalogue change.
        run: python scripts/build_pr_body.py > "$RUNNER_TEMP/vindico_pr_body.md"

      - name: Open review PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: catalog/candidates
          commit-message: "Add settlement candidates from weekly scan"
          title: "Weekly scan: new settlement candidates for review"
          body-path: ${{ runner.temp }}/vindico_pr_body.md
          labels: catalog-review
          delete-branch: true
